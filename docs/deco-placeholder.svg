<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#18135D"/>
      <stop offset="100%" stop-color="#0B102F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#DFBD72"/>
      <stop offset="100%" stop-color="#9C7B3B"/>
    </linearGradient>
    <linearGradient id="burgundy" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#934040" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#681A1A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5A736D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#23281B" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="url(#bg)"/>
  <!-- subtle rays -->
  <g opacity="0.45">
    <path d="M600,780 L600,120" stroke="url(#gold)" stroke-width="3"/>
    <path d="M600,780 L520,140" stroke="url(#gold)" stroke-width="2"/>
    <path d="M600,780 L680,140" stroke="url(#gold)" stroke-width="2"/>
    <path d="M600,780 L460,180" stroke="url(#gold)" stroke-width="2"/>
    <path d="M600,780 L740,180" stroke="url(#gold)" stroke-width="2"/>
  </g>
  <!-- arches -->
  <g fill="none" stroke="url(#gold)" opacity="0.8">
    <path d="M200,760 C200,480 1000,480 1000,760" stroke-width="4"/>
    <path d="M260,760 C260,520 940,520 940,760" stroke-width="3"/>
    <path d="M320,760 C320,560 880,560 880,760" stroke-width="2"/>
  </g>
  <!-- burgundy + green accents -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#burgundy)" opacity="0.25"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#green)" opacity="0.18"/>
  <!-- dotted border -->
  <rect x="24" y="24" width="1152" height="752" fill="none" stroke="#DFBD72" stroke-width="2" opacity="0.6"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="'Fino Sans', serif" font-size="38" fill="#DFBD72" opacity="0.85">Art Deco Placeholder</text>
</svg>
