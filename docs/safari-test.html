<!DOCTYPE html>
<html>
<head><title>Safari Autoplay Test</title></head>
<body style="background:#000;color:#fff;font-family:sans-serif;padding:2rem;">
<h2>Safari Autoplay Test</h2>
<p id="status">Testing...</p>
<video id="v" muted autoplay playsinline loop
  style="width:400px;border:2px solid red;"
  src="IMAGES/RACA-FRONT-ENTRANCE.mp4"></video>
<script>
  const v = document.getElementById('v');
  const s = document.getElementById('status');
  v.play().then(() => {
    s.textContent = 'SUCCESS - Autoplay works. The issue is in the React code.';
    s.style.color = 'lime';
  }).catch(e => {
    s.textContent = 'BLOCKED - Safari is blocking autoplay. Error: ' + e.message +
      '. Go to Safari > Settings > Websites > Auto-Play and set this site to "Allow All Auto-Play"';
    s.style.color = 'red';
  });
</script>
</body>
</html>
