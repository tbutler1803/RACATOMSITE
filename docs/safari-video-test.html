<!DOCTYPE html>
<html>
<head>
  <title>Safari Video Autoplay Test</title>
  <style>
    body { background: #0a0f1e; color: #fff; font-family: sans-serif; padding: 40px; }
    .test { margin: 20px 0; padding: 20px; border: 1px solid #333; }
    .test h3 { margin-top: 0; }
    video { width: 300px; height: 200px; object-fit: cover; display: block; }
    #status { white-space: pre-wrap; background: #111; padding: 20px; margin-top: 20px; font-family: monospace; font-size: 14px; max-height: 400px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Safari Video Autoplay Test</h1>
  <p>Do NOT click anywhere. Just wait 3 seconds and read results below.</p>

  <div class="test">
    <h3>Test A: Original file (9MB, 32Mbps, Main profile)</h3>
    <video id="vA" muted autoplay playsinline loop>
      <source src="/IMAGES/attached_assets/SloMo.mp4" type="video/mp4">
    </video>
    <div id="sA">⏳ waiting...</div>
  </div>

  <div class="test">
    <h3>Test B: Re-encoded (965KB, Baseline profile, faststart)</h3>
    <video id="vB" muted autoplay playsinline loop>
      <source src="/IMAGES/attached_assets/SloMo_safari.mp4" type="video/mp4">
    </video>
    <div id="sB">⏳ waiting...</div>
  </div>

  <div id="status">Loading tests...\n</div>

  <script>
    const statusEl = document.getElementById('status');
    const log = (msg) => { statusEl.textContent += msg + '\n'; console.log(msg); };

    log('User Agent: ' + navigator.userAgent);

    ['A', 'B'].forEach(id => {
      const v = document.getElementById('v' + id);
      const s = document.getElementById('s' + id);

      v.addEventListener('playing', () => { s.textContent = '✅ PLAYING'; log('Test ' + id + ': PLAYING'); });
      v.addEventListener('error', () => {
        const e = v.error;
        s.textContent = '❌ ERROR: ' + (e ? e.message + ' (code ' + e.code + ')' : 'unknown');
        log('Test ' + id + ': ERROR - ' + (e ? e.message + ' code=' + e.code : 'unknown'));
      });
      v.addEventListener('stalled', () => log('Test ' + id + ': stalled event'));
      v.addEventListener('waiting', () => log('Test ' + id + ': waiting event'));
      v.addEventListener('canplay', () => log('Test ' + id + ': canplay event'));
      v.addEventListener('loadeddata', () => log('Test ' + id + ': loadeddata event'));
      v.addEventListener('suspend', () => log('Test ' + id + ': suspend event'));

      // Check after 3 seconds
      setTimeout(() => {
        log('Test ' + id + ': paused=' + v.paused + ' readyState=' + v.readyState + ' networkState=' + v.networkState + ' currentTime=' + v.currentTime + ' muted=' + v.muted + ' hasAttribute(muted)=' + v.hasAttribute('muted'));
        if (v.paused) {
          s.textContent = '❌ PAUSED (readyState=' + v.readyState + ', networkState=' + v.networkState + ')';
          // Try manual play
          v.play().then(() => {
            log('Test ' + id + ': manual play() SUCCEEDED');
            s.textContent += ' → play() worked after 3s';
          }).catch(e => {
            log('Test ' + id + ': manual play() REJECTED: ' + e.name + ': ' + e.message);
            s.textContent += ' → play() rejected: ' + e.message;
          });
        }
      }, 3000);
    });
  </script>
</body>
</html>
